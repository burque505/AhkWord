# AhkWord's documentation (MkDocs with the Material theme). Build or preview it with make_docs.py.
site_name: AhkWord
site_url: https://burque505.github.io/AhkWord/
site_description: A word processor for Windows that AutoHotkey scripts can drive while you type.
repo_url: https://github.com/burque505/AhkWord
repo_name: burque505/AhkWord
edit_uri: ""
copyright: AhkWord is under the MIT license.

theme:
  name: material
  logo: assets/ahkword-256.png
  favicon: assets/ahkword-256.png
  font: false            # (the system's fonts: no request to Google Fonts)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Spanish pages: a page.es.md beside page.md (docs_structure: suffix), under /es/. A page without its .es.md
  # shows in English there, so the Spanish site is whole while it is being translated.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          site_description: Un procesador de textos para Windows que los scripts de AutoHotkey pueden manejar mientras usted escribe.
          nav_translations:
            Home: Inicio
            Getting started: Primeros pasos
            User guide: Guía del usuario
            Documents and files: Documentos y archivos
            Formatting and paragraphs: Formato y párrafos
            Styles: Estilos
            Lists and numbering: Listas y numeración
            Tables: Tablas
            Pages and printing: Páginas e impresión
            Line numbers: Números de línea
            Pictures: Imágenes
            Markdown and HTML views: Vistas Markdown y HTML
            Templates: Plantillas
            The ribbon and keyboard: La cinta y el teclado
            Themes: Temas
            For legal drafting: Para la redacción jurídica
            Automation: Automatización
            Scripts, events and macros: Scripts, eventos y macros
            API reference: Referencia de la API
            Reference: Referencia
            Requirements: Requisitos
            Settings and folders: Configuración y carpetas
            File formats and converters: Formatos de archivo y convertidores
            Known limitations: Limitaciones conocidas
            Troubleshooting: Solución de problemas
            For developers: Para desarrolladores
            Roadmap: Hoja de ruta

extra_css:
  - assets/ahkword.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.tabbed: { alternate_style: true }

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Documents and files: guide/documents.md
      - Formatting and paragraphs: guide/formatting.md
      - Styles: guide/styles.md
      - Lists and numbering: guide/lists.md
      - Tables: guide/tables.md
      - Pages and printing: guide/pages.md
      - Line numbers: guide/line-numbers.md
      - Pictures: guide/pictures.md
      - Markdown and HTML views: guide/source-views.md
      - Templates: guide/templates.md
      - The ribbon and keyboard: guide/ribbon.md
      - Themes: guide/themes.md
  - For legal drafting: legal.md
  - Automation:
      - Scripts, events and macros: automation/index.md
      - API reference: automation/api.md
  - Reference:
      - Requirements: reference/requirements.md
      - Settings and folders: reference/settings.md
      - File formats and converters: reference/formats.md
      - Known limitations: reference/limitations.md
      - Troubleshooting: reference/troubleshooting.md
  - For developers: developers.md
  - Roadmap: https://github.com/burque505/AhkWord/blob/main/ROADMAP.md
